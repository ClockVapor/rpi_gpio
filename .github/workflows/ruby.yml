name: Ruby

permissions:
  contents: read

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
        - "2.7"
        - "3.0"
        - "3.1"
        - "3.2"
        - "3.3"
        - "4.0"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Compile C code
      run: bundle exec rake compile
